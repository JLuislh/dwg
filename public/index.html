<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor de DRAWINGS y Fotos · P/N</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a3340;
    --txt:#e6edf3; --dim:#8b97a5; --accent:#ffb000; --accent2:#3b9eff;
    --pdf:#ff6b5e; --img:#4cc38a;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--txt);font-family:var(--sans);
    display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden;
  }
  /* ---------- Top bar ---------- */
  header{
    display:flex;align-items:center;gap:16px;padding:12px 18px;
    background:linear-gradient(180deg,#1a212b,#12171e);
    border-bottom:1px solid var(--line);
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px}
  .logo .dot{width:11px;height:11px;border-radius:2px;background:var(--accent);
    box-shadow:0 0 12px var(--accent)}
  .logo span{font-size:13px;color:var(--dim);font-weight:500}
  .search{flex:1;max-width:520px;position:relative}
  .search input{
    width:100%;padding:11px 14px 11px 40px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    font-family:var(--mono);font-size:15px;letter-spacing:.5px;outline:none;
    transition:border .15s,box-shadow .15s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,176,0,.12)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;stroke:var(--dim)}
  .meta{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim);
    text-align:right;line-height:1.5}
  .meta b{color:var(--accent)}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    padding:8px 12px;border-radius:7px;cursor:pointer;font-size:12px;
    font-family:var(--mono);transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  /* ---------- Layout ---------- */
  .body{display:grid;grid-template-columns:320px 1fr;height:100%;overflow:hidden}
  aside{background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden}
  .list-head{padding:12px 16px;font-size:11px;text-transform:uppercase;
    letter-spacing:1.5px;color:var(--dim);border-bottom:1px solid var(--line)}
  .list{overflow-y:auto;flex:1}
  .pn{
    padding:12px 16px;border-bottom:1px solid #1d242e;cursor:pointer;
    display:flex;flex-direction:column;gap:5px;transition:.12s;
    border-left:3px solid transparent;
  }
  .pn:hover{background:var(--panel2)}
  .pn.active{background:var(--panel2);border-left-color:var(--accent)}
  .pn .id{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.5px}
  .pn .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:4px;
    background:#222b36;color:var(--dim)}
  .count{display:inline-flex;align-items:center;gap:4px;font-size:11px;
    font-family:var(--mono)}
  .count.pdf{color:var(--pdf)} .count.img{color:var(--img)}
  /* ---------- Main viewer ---------- */
  main{display:flex;flex-direction:column;overflow:hidden;background:#0b0e12}
  .toolbar{display:flex;align-items:center;gap:8px;padding:10px 16px;
    border-bottom:1px solid var(--line);background:var(--panel);min-height:52px}
  .toolbar .title{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.5px}
  .toolbar .cat{font-size:11px;color:var(--dim);font-family:var(--mono)}
  .switch{margin-left:auto;display:flex;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;overflow:hidden}
  .switch button{background:none;border:none;color:var(--dim);padding:7px 14px;
    cursor:pointer;font-size:12px;font-family:var(--mono);display:flex;align-items:center;gap:6px}
  .switch button.on{background:var(--accent);color:#1a1200;font-weight:600}
  .switch button:disabled{opacity:.35;cursor:not-allowed}
  .stage{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;min-height:0}
  /* ---------- Breadcrumb ---------- */
  .breadcrumb{
    display:none;align-items:center;gap:4px;padding:5px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);
    font-size:11px;font-family:var(--mono);flex-wrap:wrap;min-height:28px;
  }
  .breadcrumb .crumb{color:var(--accent2);cursor:pointer;padding:1px 4px;border-radius:3px}
  .breadcrumb .crumb:hover{background:var(--panel2);text-decoration:underline}
  .breadcrumb .sep{color:var(--line)}
  .breadcrumb .cur{color:var(--txt)}
  /* ---------- Files row ---------- */
  .files-wrapper{
    display:flex;align-items:center;padding:10px 16px;
    border-bottom:1px solid var(--line);background:#0d1117;
  }
  .files{
    flex:1;overflow-x:auto;display:flex;gap:8px;padding:0;
    -ms-overflow-style:none;scrollbar-width:none;
  }
  .files::-webkit-scrollbar{display:none}
  .scroll-arrow{
    flex-shrink:0;width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:var(--dim);cursor:pointer;user-select:none;
    transition:color .15s,opacity .2s;opacity:0;
    background:var(--panel);border-radius:6px;
  }
  .scroll-arrow:hover{color:var(--accent)}
  .scroll-arrow.visible{opacity:1}
  .scroll-arrow.left{margin-right:8px}
  .scroll-arrow.right{margin-left:8px}
  .chip{white-space:nowrap;padding:7px 12px;border:1px solid var(--line);
    border-radius:6px;font-family:var(--mono);font-size:12px;cursor:pointer;
    color:var(--dim);background:var(--panel);transition:.12s}
  .chip:hover{border-color:var(--accent2);color:var(--txt)}
  .chip.sel{border-color:var(--accent);color:var(--accent);background:#1d1607}
  /* carpeta navegable */
  .chip.dir{border-style:dashed;color:var(--accent2);font-weight:600}
  .chip.dir:hover{border-color:var(--accent2);color:var(--txt);background:var(--panel2)}
  iframe{width:100%;height:100%;border:none;background:#525659;display:block}
  /* gallery */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:12px;padding:16px}
  .thumb{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    overflow:hidden;cursor:pointer;transition:.15s}
  .thumb:hover{border-color:var(--img);transform:translateY(-2px)}
  .thumb img{width:100%;height:150px;object-fit:cover;display:block;background:#000}
  .thumb .cap{padding:7px 9px;font-family:var(--mono);font-size:11px;color:var(--dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* empty */
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;color:var(--dim);gap:14px;text-align:center;padding:40px}
  .empty svg{width:54px;height:54px;stroke:var(--line)}
  .empty h2{font-weight:500;font-size:17px;color:var(--dim)}
  .empty p{font-size:13px;font-family:var(--mono);max-width:340px;line-height:1.6}
  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;
    align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:14px}
  .lb.show{display:flex}
  .lb img{max-width:92vw;max-height:82vh;object-fit:contain;
    box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .lb .cap{font-family:var(--mono);font-size:13px;color:var(--dim)}
  .lb .x{position:absolute;top:20px;right:24px;font-size:30px;color:#fff;
    cursor:pointer;line-height:1;opacity:.7}
  .lb .x:hover{opacity:1}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:44px;
    color:#fff;cursor:pointer;opacity:.5;padding:0 22px;user-select:none}
  .lb .nav:hover{opacity:1}
  .lb .prev{left:0} .lb .next{right:0}
  /* scrollbar */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2a3340;border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:#3a4655}
  @media(max-width:760px){
    .body{grid-template-columns:1fr}
    aside{position:absolute;z-index:20;width:300px;height:100%;
      transition:transform .2s;box-shadow:8px 0 24px rgba(0,0,0,.4)}
    aside.hide{transform:translateX(-100%)}
  }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot"></span>VISOR&nbsp;P/N <span>· DRAWINGS & fotos</span></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="Buscar P/N o categoría…" autocomplete="off" spellcheck="false">
  </div>
  <button class="btn" id="reindex" title="Volver a escanear el NAS">↻ Reindexar</button>
  <div class="meta"><span id="count">—</span><br><span id="stamp"></span></div>
</header>

<div class="body">
  <aside id="aside">
    <div class="list-head">Resultados</div>
    <div class="list" id="list"></div>
  </aside>

  <main>
    <div class="toolbar" id="toolbar" style="display:none">
      <div>
        <div class="title" id="vTitle"></div>
        <div class="cat" id="vCat"></div>
      </div>
      <div class="switch">
        <button id="tabPdf" onclick="setMode('pdf')">▤ DRAWINGS <span id="nPdf"></span></button>
        <button id="tabImg" onclick="setMode('img')">▦ Fotos <span id="nImg"></span></button>
      </div>
    </div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="files-wrapper" id="filesWrapper" style="display:none">
      <div class="scroll-arrow left" id="scrollLeft">‹</div>
      <div class="files" id="files"></div>
      <div class="scroll-arrow right" id="scrollRight">›</div>
    </div>
    <div class="stage" id="stage">
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        <h2>Selecciona un P/N</h2>
        <p>Escribe un número de parte o categoría en el buscador, y elige un resultado de la lista.</p>
      </div>
    </div>
  </main>
</div>

<div class="lb" id="lb">
  <span class="x" onclick="closeLb()">×</span>
  <span class="nav prev" onclick="stepLb(-1)">‹</span>
  <span class="nav next" onclick="stepLb(1)">›</span>
  <img id="lbImg" src="">
  <div class="cap" id="lbCap"></div>
</div>

<script>
let ITEMS = [], current = null, mode = 'pdf', gallery = [], lbIdx = 0, timer = null;
let filesContainer, scrollLeftBtn, scrollRightBtn;

// Estado del navegador de carpetas
let browseRootPath = '';   // ruta relativa de la carpeta P/N en drawings
let browsePathParts = [];  // subcarpetas navegadas después del root
let browseFiles = [];      // archivos del nivel actual (para showBrowseFile)

const $ = s => document.querySelector(s);

async function load(q=''){
  const r = await fetch('/api/index' + (q ? '?q='+encodeURIComponent(q) : ''));
  const d = await r.json();
  ITEMS = d.items;
  $('#count').innerHTML = '<b>'+d.total+'</b> P/N';
  $('#stamp').textContent = 'idx ' + new Date(d.generado).toLocaleString('es-GT',{dateStyle:'short',timeStyle:'short'});
  renderList();
}

function renderList(){
  const el = $('#list');
  if(!ITEMS.length){ el.innerHTML = '<div style="padding:30px 16px;color:var(--dim);font-family:var(--mono);font-size:13px">Sin resultados.</div>'; return; }
  el.innerHTML = ITEMS.slice(0,500).map((it,i)=>`
    <div class="pn ${current&&current.pn===it.pn?'active':''}" onclick="seleccionarPn(${i})">
      <div class="id">${esc(it.pn)}</div>
      <div class="tags">
        ${it.categorias.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}
        ${it.nPdf?`<span class="count pdf">▤ ${it.nPdf}</span>`:(it.drawingsDirs&&it.drawingsDirs.length?'<span class="count pdf">▤ dwg</span>':'')}
        ${it.nFoto?`<span class="count img">▦ ${it.nFoto}</span>`:''}
      </div>
    </div>`).join('');
}

function seleccionarPn(i){
  current = ITEMS[i];
  renderList();
  $('#toolbar').style.display='flex';
  $('#vTitle').textContent = current.pn;
  $('#vCat').textContent = current.categorias.join(' · ') || '';
  const hasDwg = current.nPdf > 0 || (current.drawingsDirs && current.drawingsDirs.length > 0);
  $('#nPdf').textContent = current.nPdf ? `(${current.nPdf})` : '';
  $('#nImg').textContent = current.nFoto ? `(${current.nFoto})` : '';
  $('#tabPdf').disabled = !hasDwg;
  $('#tabImg').disabled = !current.nFoto;
  setMode(hasDwg ? 'pdf' : 'img');
  if(window.innerWidth<=760) $('#aside').classList.add('hide');
}

function setMode(m){
  mode = m;
  $('#tabPdf').classList.toggle('on', m==='pdf');
  $('#tabImg').classList.toggle('on', m==='img');
  if(m==='pdf') renderPdf(); else renderImg();
}

// ---- Modo DRAWINGS: navegador de carpetas ----

function renderPdf(){
  $('#files').style.display = '';
  browsePathParts = [];

  if (current.drawingsDirs && current.drawingsDirs.length > 0) {
    // Modo navegador: usar la carpeta P/N del NAS directamente
    browseRootPath = current.drawingsDirs[0];
    browseDir();
  } else {
    // Fallback: lista plana de PDFs indexados
    $('#breadcrumb').style.display = 'none';
    const files = current.pdfs;
    $('#filesWrapper').style.display = files.length > 0 ? 'flex' : 'none';
    $('#files').innerHTML = files.map((f,i)=>
      `<div class="chip ${i===0?'sel':''}" onclick="showPdf(${i},this)">
        ${f.subcarpeta?`<span style="color:var(--dim);font-size:10px">${esc(f.subcarpeta)} / </span>`:''}${f.nombre.toLowerCase().endsWith('.dwg')?'<span style="color:var(--accent)">DWG</span> ':''}${esc(f.nombre)}
      </div>`).join('');
    if(files.length > 0) showPdf(0);
    updateScrollArrows();
  }
}

async function browseDir(){
  const relPath = browseRootPath + (browsePathParts.length ? '/' + browsePathParts.join('/') : '');

  // Breadcrumb
  const crumbs = [current.pn, ...browsePathParts];
  const bc = $('#breadcrumb');
  if (crumbs.length > 1) {
    bc.style.display = 'flex';
    bc.innerHTML = crumbs.map((label, i) => {
      if (i === crumbs.length - 1)
        return `<span class="cur">${esc(label)}</span>`;
      return `<span class="crumb" onclick="browseBack(${i})">${esc(label)}</span>`;
    }).join('<span class="sep"> › </span>');
  } else {
    bc.style.display = 'none';
  }

  // Obtener contenido de la carpeta
  let d;
  try {
    const r = await fetch('/api/browse?source=drawings&path=' + encodeURIComponent(relPath));
    d = await r.json();
  } catch(e) {
    $('#stage').innerHTML = `<div class="empty"><h2>Error de conexión</h2><p>${esc(String(e))}</p></div>`;
    return;
  }
  browseFiles = d.archivos || [];

  // Renderizar: primero carpetas, luego archivos
  const chips = [];
  for (const sub of (d.subcarpetas || [])) {
    chips.push(`<div class="chip dir" onclick="browseInto('${escJs(sub)}')">▸ ${esc(sub)}</div>`);
  }
  for (let i = 0; i < browseFiles.length; i++) {
    const f = browseFiles[i];
    const isDwg = f.nombre.toLowerCase().endsWith('.dwg');
    chips.push(`<div class="chip" onclick="showBrowseFile(${i},this)">${isDwg?'<span style="color:var(--accent)">DWG</span> ':''}${esc(f.nombre)}</div>`);
  }

  $('#files').innerHTML = chips.join('');
  $('#filesWrapper').style.display = chips.length > 0 ? 'flex' : 'none';

  if (browseFiles.length > 0) {
    // Mostrar primer archivo automáticamente
    const firstFileChip = $('#files .chip:not(.dir)');
    if (firstFileChip) firstFileChip.classList.add('sel');
    showBrowseFileByObj(browseFiles[0]);
  } else if (!d.subcarpetas || !d.subcarpetas.length) {
    $('#stage').innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg><h2>Carpeta vacía</h2><p>No hay archivos PDF ni DWG en esta carpeta.</p></div>`;
  } else {
    // Solo subcarpetas, no hay archivo para mostrar todavía
    $('#stage').innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg><h2>Selecciona una carpeta</h2><p>Haz clic en una carpeta (▸) para ver su contenido.</p></div>`;
  }

  updateScrollArrows();
}

function browseInto(folderName){
  browsePathParts.push(folderName);
  browseDir();
}

function browseBack(level){
  // level=0 → volver al root del P/N; level=n → volver a ese nivel
  browsePathParts = browsePathParts.slice(0, level);
  browseDir();
}

function showBrowseFile(i, chip){
  if(chip){
    document.querySelectorAll('#files .chip').forEach(c=>c.classList.remove('sel'));
    chip.classList.add('sel');
  }
  showBrowseFileByObj(browseFiles[i]);
}

let _blobUrl = null;

async function showBrowseFileByObj(f){
  if(!f) return;
  if(f.nombre.toLowerCase().endsWith('.dwg')){
    mostrarDwg(f.url, f.nombre);
  } else {
    await mostrarPdf(f.url, f.nombre);
  }
}

// Fallback para PDFs indexados directamente (sin drawingsDirs)
function showPdf(i, chip){
  if(chip){document.querySelectorAll('#files .chip').forEach(c=>c.classList.remove('sel'));chip.classList.add('sel');}
  const f = current.pdfs[i];
  if(f.nombre.toLowerCase().endsWith('.dwg')){
    mostrarDwg(f.url, f.nombre);
  } else {
    mostrarPdf(f.url, f.nombre);
  }
}

function mostrarDwg(url, nombre){
  $('#stage').innerHTML = `
    <div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="stroke:var(--accent);width:64px;height:64px">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
      </svg>
      <h2 style="color:var(--txt)">Archivo AutoCAD (DWG)</h2>
      <p>Los navegadores no pueden mostrar DWG directamente.</p>
      <a href="${url}" download="${nombre}" class="btn" style="margin-top:15px;border-color:var(--accent);color:var(--accent);text-decoration:none;display:inline-block;padding:10px 20px">
        Descargar ${esc(nombre)}
      </a>
    </div>`;
}

async function mostrarPdf(url, nombre){
  $('#stage').innerHTML = `<div class="empty"><h2>Cargando…</h2></div>`;

  // Liberar blob anterior
  if(_blobUrl){ URL.revokeObjectURL(_blobUrl); _blobUrl = null; }

  try {
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('Error ' + resp.status + ' al leer el archivo');
    const bytes = await resp.arrayBuffer();
    // Forzar tipo application/pdf independientemente de los headers del servidor
    const blob = new Blob([bytes], { type: 'application/pdf' });
    _blobUrl = URL.createObjectURL(blob);
    $('#stage').innerHTML = `<iframe src="${_blobUrl}"></iframe>`;
  } catch(err) {
    $('#stage').innerHTML = `
      <div class="empty">
        <h2>No se pudo mostrar</h2>
        <p style="font-family:var(--mono);font-size:12px">${esc(String(err))}</p>
        <a href="${url}" target="_blank" class="btn"
           style="margin-top:15px;border-color:var(--accent2);color:var(--accent2);text-decoration:none;display:inline-block;padding:10px 20px">
          Abrir en nueva pestaña
        </a>
      </div>`;
  }
}

function renderImg(){
  $('#filesWrapper').style.display = 'none';
  $('#breadcrumb').style.display = 'none';
  gallery = current.fotos;
  $('#stage').innerHTML = `<div class="gallery">${
    gallery.map((f,i)=>`
      <div class="thumb" onclick="openLb(${i})">
        <img loading="lazy" src="${f.url}" alt="">
        <div class="cap">${esc(f.nombre)}</div>
      </div>`).join('')
  }</div>`;
  updateScrollArrows();
}

/* lightbox */
function openLb(i){ lbIdx=i; paintLb(); $('#lb').classList.add('show'); }
function closeLb(){ $('#lb').classList.remove('show'); }
function stepLb(d){ lbIdx=(lbIdx+d+gallery.length)%gallery.length; paintLb(); }
function paintLb(){ const f=gallery[lbIdx]; $('#lbImg').src=f.url; $('#lbCap').textContent=f.nombre+'  ('+(lbIdx+1)+'/'+gallery.length+')'; }
document.addEventListener('keydown',e=>{
  if(!$('#lb').classList.contains('show'))return;
  if(e.key==='Escape')closeLb(); if(e.key==='ArrowRight')stepLb(1); if(e.key==='ArrowLeft')stepLb(-1);
});

/* search */
$('#q').addEventListener('input', e=>{
  clearTimeout(timer);
  timer = setTimeout(()=>load(e.target.value), 220);
});

$('#reindex').addEventListener('click', async ()=>{
  $('#reindex').textContent='Escaneando…'; $('#reindex').disabled=true;
  await fetch('/api/reindex');
  await load($('#q').value);
  $('#reindex').textContent='↻ Reindexar'; $('#reindex').disabled=false;
});

/* scroll arrows */
function initScrollArrows(){
  filesContainer = $('#files');
  scrollLeftBtn = $('#scrollLeft');
  scrollRightBtn = $('#scrollRight');
  scrollLeftBtn.addEventListener('click', ()=>filesContainer.scrollBy({left:-150,behavior:'smooth'}));
  scrollRightBtn.addEventListener('click', ()=>filesContainer.scrollBy({left:150,behavior:'smooth'}));
  filesContainer.addEventListener('scroll', updateScrollArrows);
  window.addEventListener('resize', updateScrollArrows);
}
function updateScrollArrows(){
  if(!filesContainer || $('#filesWrapper').style.display==='none'){
    scrollLeftBtn.classList.remove('visible');
    scrollRightBtn.classList.remove('visible');
    return;
  }
  const {scrollWidth,clientWidth,scrollLeft} = filesContainer;
  const over = scrollWidth > clientWidth;
  scrollLeftBtn.classList.toggle('visible', over && scrollLeft > 0);
  scrollRightBtn.classList.toggle('visible', over && (scrollLeft+clientWidth < scrollWidth));
}
document.addEventListener('DOMContentLoaded', initScrollArrows);

/* utils */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function escJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

load();
</script>
</body>
</html>
